#:schema https://senzor.kankaj.cz/schema/project.json
# Sensors that reach Home Assistant in shapes Senzor's own discovery does not produce. Each one publishes
# its Home Assistant discovery config itself, retained, from a separate "-config" device.
#
# - sim_vzduch_attr: ONE entity whose state is "online" and whose values are attributes (co2, temperature),
#   like MQTT sensors with json_attributes_topic. The room editor must offer the attribute `co2`.
#   Entity: sensor.sim_vzduch_attr
# - sim_co2_trida: a CO2 entity with device_class carbon_dioxide, as most real CO2 sensors have. It must be
#   ranked first in the sensor picker. Entity: sensor.sim_co2_trida_co2
#
# Run: SENZOR_MQTT_PASSWORD=… senzor tools/senzor/shapes.toml
# Remove from Home Assistant: stop, then `senzor-cli clear-retained tools/senzor/shapes.toml`.

[broker]
host = "homeassistant.local"
port = 1883
client_id_prefix = "senzor-luftator-"
username = "senzor"
password_env = "SENZOR_MQTT_PASSWORD"

[simulation]
seed = 43

# --- One entity, values in attributes -----------------------------------------------------------------

[[templates]]
id = "attr-config"
interval = "10m"
qos = 1
retain = true
fields.version = { generator = "constant", value = 1 }

[[templates.messages]]
topic = "homeassistant/sensor/sim_vzduch_attr/config"
payload = '''{"name": null, "unique_id": "senzor_sim_vzduch_attr", "object_id": "sim_vzduch_attr", "state_topic": "senzor/sim_vzduch_attr/state", "json_attributes_topic": "senzor/sim_vzduch_attr/attributes", "availability_topic": "senzor/sim_vzduch_attr/status", "device": {"identifiers": ["senzor_sim_vzduch_attr"], "name": "sim_vzduch_attr", "manufacturer": "Senzor", "model": "attributes"}}'''

[[templates]]
id = "attr-data"
interval = "30s"
availability = { topic = "senzor/{{ device_id }}/status", online = "online", offline = "offline" }

[[templates.messages]]
topic = "senzor/{{ device_id }}/state"
payload = "online"

[[templates.messages]]
topic = "senzor/{{ device_id }}/attributes"
payload = '{"co2": {{ co2 | round | int }}, "temperature": {{ temperature | round(1) }}}'

[templates.fields.co2]
generator = "random_walk"
start = 750
min = 420
max = 2500
step = 10

[templates.fields.temperature]
generator = "sine"
center = 21.5
amplitude = 1
period = "24h"

[[devices]]
id = "sim_vzduch_attr_config"
template = "attr-config"

[[devices]]
id = "sim_vzduch_attr"
template = "attr-data"

# --- A CO2 entity with device_class carbon_dioxide ----------------------------------------------------

[[templates]]
id = "class-config"
interval = "10m"
qos = 1
retain = true
fields.version = { generator = "constant", value = 1 }

[[templates.messages]]
topic = "homeassistant/sensor/sim_co2_trida/config"
payload = '''{"name": "CO2", "unique_id": "senzor_sim_co2_trida_co2", "object_id": "sim_co2_trida_co2", "device_class": "carbon_dioxide", "state_class": "measurement", "unit_of_measurement": "ppm", "state_topic": "senzor/sim_co2_trida/state", "availability_topic": "senzor/sim_co2_trida/status", "device": {"identifiers": ["senzor_sim_co2_trida"], "name": "sim_co2_trida", "manufacturer": "Senzor", "model": "device-class"}}'''

[[templates]]
id = "class-data"
interval = "30s"
availability = { topic = "senzor/{{ device_id }}/status", online = "online", offline = "offline" }

[[templates.messages]]
topic = "senzor/{{ device_id }}/state"
payload = "{{ co2 | round | int }}"

[templates.fields.co2]
generator = "random_walk"
start = 650
min = 420
max = 2500
step = 10

[[devices]]
id = "sim_co2_trida_config"
template = "class-config"

[[devices]]
id = "sim_co2_trida"
template = "class-data"
