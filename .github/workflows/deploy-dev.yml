name: Publish Dev Addon

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Sync dist to addon
        run: node scripts/sync-dist.mjs

      - name: Prepare dev config
        run: |
          cd addon
          # Modify for dev version
          sed -i 's/name: LUFTaTOR$/name: LUFTaTOR (Development)/' config.yaml
          sed -i 's/slug: luftator$/slug: luftator-dev/' config.yaml
          sed -i 's/description: LUFTaTOR Home Assistant Add-on$/description: LUFTaTOR Home Assistant Add-on (Development Version)/' config.yaml
          sed -i 's/image: "ghcr.io\/luftuj-cz\/{arch}-addon-luftuj"$/image: "ghcr.io\/luftuj-cz\/{arch}-addon-luftuj-dev"/' config.yaml
          # Update version to dev
          sed -i 's/-stable$/-dev/' config.yaml

      - name: Extract version
        id: version
        run: |
          version=$(grep '^version:' addon/config.yaml | awk '{print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@bb9bc86ea4c721825986c19b52e4da07be0f0fde # master (2026-08-20)
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: addon-luftuj-dev
          registry-prefix: ghcr.io/luftuj-cz

      - name: Upload addon context
        uses: actions/upload-artifact@v7
        with:
          name: addon-context
          path: addon/

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download addon context
        uses: actions/download-artifact@v8
        with:
          name: addon-context
          path: addon/

      - name: Build and push
        uses: home-assistant/builder/actions/build-image@bb9bc86ea4c721825986c19b52e4da07be0f0fde # master (2026-08-20)
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          version: ${{ needs.prepare.outputs.version }}
          context: addon
          push: "true"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24

  publish:
    name: Publish manifest
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@bb9bc86ea4c721825986c19b52e4da07be0f0fde # master (2026-08-20)
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: addon-luftuj-dev
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/luftuj-cz
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"
