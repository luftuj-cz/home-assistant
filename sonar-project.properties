sonar.projectKey=kankaj_luftuj
sonar.organization=kankaj

sonar.sourceEncoding=UTF-8

sonar.tests=addon/rootfs/usr/src/app/tests

# Excluded from main sources (sonar.exclusions does not filter sonar.tests):
#   www/**       committed frontend build output, mirrored by scripts/sync-dist.mjs
#   locales/**   generated by scripts/copy-translations.mjs
#   simulator/** dev-only HRU test tool, never shipped in the add-on
#   tests/**     declared above as tests rather than main sources
sonar.exclusions=addon/rootfs/usr/share/luftujha/www/**,\
  addon/rootfs/usr/src/app/src/locales/**,\
  tools/simulator/**,\
  addon/rootfs/usr/src/app/tests/**,\
  addon/rootfs/usr/src/app/coverage/**

# The root tsconfig.json is solution-style ("files": []), so point the analyzer at
# the configs that actually resolve files, or type-aware rules degrade silently.
sonar.typescript.tsconfigPaths=tsconfig.app.json,\
  tsconfig.node.json,\
  addon/rootfs/usr/src/app/tsconfig.json

sonar.javascript.lcov.reportPaths=addon/rootfs/usr/src/app/coverage/lcov.info
