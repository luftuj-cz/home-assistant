<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="LUFTaTOR - Home Assistant Add-on for ventilation control" name="description" />

    <!-- Critical resource hints -->
    <link crossorigin href="http://localhost:8000" rel="preconnect" />
    <link href="http://localhost:8000" rel="dns-prefetch" />

    <!-- Favicon and icons -->
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="favicon.ico" rel="shortcut icon" />
    <link href="apple-touch-icon.png" rel="apple-touch-icon" />

    <title>LUFTaTOR HASS Add-on</title>

    <script>
      (function () {
        try {
          const saved = globalThis.localStorage.getItem("luftujha-color-scheme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.dataset.mantineColorScheme = saved;
          } else {
            document.documentElement.dataset.mantineColorScheme = "dark";
          }
        } catch {
          document.documentElement.dataset.mantineColorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/app/main.tsx" type="module"></script>
  </body>
</html>
