<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="LUFTaTOR - Home Assistant Add-on for ventilation control" name="description" />

    <!-- Critical resource hints -->
    <link crossorigin href="http://localhost:8000" rel="preconnect" />
    <link href="http://localhost:8000" rel="dns-prefetch" />

    <!-- Favicon and icons -->
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="favicon.ico" rel="shortcut icon" />
    <link href="apple-touch-icon.png" rel="apple-touch-icon" />

    <title>LUFTaTOR HASS Add-on</title>

    <script>
      // Applies the saved theme (.dark, data-theme) before the app loads, so there is no flash; ThemeProvider keeps
      // it in sync afterwards. Dark unless the user chose otherwise.
      (function () {
        let scheme = "dark";
        try {
          const saved = globalThis.localStorage.getItem("luftujha-color-scheme");
          if (saved === "dark" || saved === "light") {
            scheme = saved;
          } else if (saved === "system") {
            scheme = globalThis.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch {
          // Storage unavailable: keep the dark default.
        }
        const root = document.documentElement;
        root.dataset.theme = scheme;
        root.classList.toggle("dark", scheme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/app/main.tsx" type="module"></script>
  </body>
</html>
